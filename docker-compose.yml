services:
  restreamer:
    build:
      context: .
    image: restreamer:local
    container_name: restreamer
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      TZ: ${TZ:-Europe/Berlin}
      STREAMERS_FILE: /app/config/streamers.yml
      LOGS_DIR: /app/logs
      COOKIES_FILE: /app/data/cookies.txt
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - default
    volumes:
      - ./config:/app/config
      - ./logs:/app/logs
      - ./data:/app/data
      - ./fonts:/app/fonts:ro
    user: "${PUID:-1001}:${PGID:-1001}"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  asr:
    build:
      context: .
      dockerfile: asr/Dockerfile
    image: restreamer-asr:local
    container_name: restreamer-asr
    restart: unless-stopped
    profiles: ["asr"]
    depends_on:
      restreamer:
        condition: service_started
    cpus: "1.0"
    mem_limit: 768m
    environment:
      TZ: ${TZ:-Europe/Berlin}
      RELAY_PORT: ${RELAY_PORT:-19350}
      ASR_AUDIO_HOST: restreamer
      ASR_WATCHLIST_FILE: /app/data/asr-watchlist.json
      ASR_ACTIVE_FILE: /app/data/asr-active.json
      ASR_OUTPUT_PATH: /app/data/asr-words.json
      ASR_COUNTS_PATH: /app/data/asr-counts.json
      ASR_WATCHLIST: ${ASR_WATCHLIST:-Guck ma,Dreck,Ich}
      ASR_WINDOW_SECONDS: ${ASR_WINDOW_SECONDS:-600}
    volumes:
      - ./data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
