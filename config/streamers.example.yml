# Beispiel für config/streamers.yml.
#
# Streamer lassen sich auch komplett über das Dashboard anlegen und bearbeiten.
# Der YouTube-Key kann direkt hier stehen (Datei ist gitignored, Modus 600)
# oder über youtube_key_env aus der Umgebung gelesen werden.
streamers:
  - id: alice
    name: Alice
    tiktok: alice
    youtube_key: xxxx-xxxx-xxxx-xxxx
    # youtube_key_env: ALICE_YT_KEY
    video_mode: copy      # copy | reencode
    auto_start: false     # beim Containerstart automatisch starten
    enabled: true

  - id: bob
    name: Bob
    tiktok: bob
    youtube_key_env: BOB_YT_KEY
    video_mode: copy
    auto_start: false
    enabled: true
