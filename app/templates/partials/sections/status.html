    <section class="box" aria-labelledby="status-title">
      <div class="box-header">
        <h2 id="status-title">Live-Status</h2>
        <span class="eyebrow">// 01 / Relay</span>
      </div>
      <div class="kpi-grid dense">
        <div class="kpi-card wide">
          <span class="kpi-label">Aktiver Stream</span>
          <strong class="kpi-value" id="active-name">–</strong>
        </div>
        <div class="kpi-card">
          <span class="kpi-label">Status</span>
          <strong class="kpi-value" id="active-state">–</strong>
        </div>
        <div class="kpi-card">
          <span class="kpi-label">PID</span>
          <strong class="kpi-value" id="active-pid">–</strong>
        </div>
        <div class="kpi-card">
          <span class="kpi-label">YouTube-Sessions</span>
          <strong class="kpi-value" id="active-sessions">0</strong>
        </div>
        <div class="kpi-card">
          <span class="kpi-label">Streamer live</span>
          <strong class="kpi-value"><span id="online-count">–</span></strong>
        </div>
        <div class="kpi-card">
          <span class="kpi-label">Cookies</span>
          <strong class="kpi-value" id="cookies-state">–</strong>
        </div>
        <div class="kpi-card">
          <span class="kpi-label">Fortschritt</span>
          <strong class="kpi-value" id="progress-age">–</strong>
        </div>
        <div class="kpi-card">
          <span class="kpi-label">Bitrate</span>
          <strong class="kpi-value"><span id="output-bitrate">–</span></strong>
        </div>
        <div class="kpi-card">
          <span class="kpi-label">Delay-Puffer</span>
          <strong class="kpi-value" id="relay-buffer">–</strong>
        </div>
        <div class="kpi-card">
          <span class="kpi-label">Nächster Refresh</span>
          <strong class="kpi-value" id="next-refresh">–</strong>
        </div>
      </div>
    </section>
