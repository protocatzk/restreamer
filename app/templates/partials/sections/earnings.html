    <section class="box" aria-labelledby="earnings-title">
      <div class="box-header">
        <h2 id="earnings-title">Einnahmen <span id="earnings-streamer" class="muted"></span></h2>
        <div class="toolbar-controls">
          <button id="earnings-refresh-btn" class="btn ghost sm" type="button">Einnahmen aktualisieren</button>
        </div>
      </div>
      <div class="kpi-grid">
        <div class="kpi-card" id="earnings-tile-period">
          <span class="kpi-label">Zeitraum</span>
          <strong class="kpi-value" id="earnings-period">–</strong>
        </div>
        <div class="kpi-card accent" id="earnings-tile-net">
          <span class="kpi-label">Netto</span>
          <strong class="kpi-value" id="earnings-net">–</strong>
        </div>
        <div class="kpi-card" id="earnings-tile-gross">
          <span class="kpi-label">Brutto</span>
          <strong class="kpi-value" id="earnings-gross">–</strong>
        </div>
        <div class="kpi-card" id="earnings-tile-coins">
          <span class="kpi-label">Coins</span>
          <strong class="kpi-value" id="earnings-coins">–</strong>
        </div>
        <div class="kpi-card" id="earnings-tile-gifts">
          <span class="kpi-label">Gifts</span>
          <strong class="kpi-value" id="earnings-gifts">–</strong>
        </div>
        <div class="kpi-card" id="earnings-tile-gifters">
          <span class="kpi-label">Gifter</span>
          <strong class="kpi-value" id="earnings-gifters">–</strong>
        </div>
      </div>
      <div id="earnings-extra" class="spec-list" hidden>
        <div class="spec-row">
          <span class="spec-label">Session</span>
          <span class="spec-value" id="earnings-session">–</span>
        </div>
        <div class="spec-row">
          <span class="spec-label">Zuschauer</span>
          <span class="spec-value" id="earnings-viewers">–</span>
        </div>
        <div class="spec-row">
          <span class="spec-label">Follower</span>
          <span class="spec-value" id="earnings-followers">–</span>
        </div>
        <div class="spec-row">
          <span class="spec-label">Top-Gift</span>
          <span class="spec-value" id="earnings-top-gift">–</span>
        </div>
        <div class="spec-row">
          <span class="spec-label">Top-Gifter</span>
          <span class="spec-value" id="earnings-top-gifter">–</span>
        </div>
        <div class="spec-row">
          <span class="spec-label">Zuletzt gesehen</span>
          <span class="spec-value" id="earnings-last-seen">–</span>
        </div>
      </div>
      <p id="earnings-meta" class="hint"></p>
    </section>
