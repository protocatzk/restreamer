  <!-- Senderliste bearbeiten -->
  <dialog id="playlist-dialog" class="modal wide" aria-labelledby="playlist-dialog-title">
    <form id="playlist-form" novalidate>
      <div class="modal-head">
        <h2 id="playlist-dialog-title">Senderliste bearbeiten</h2>
        <button type="button" class="icon-btn" data-close aria-label="Schließen">×</button>
      </div>

      <div class="form-grid">
        <label class="field">
          <span>ID der Senderliste</span>
          <input name="id" maxlength="64" pattern="[a-z0-9][a-z0-9_-]{0,63}"
                 placeholder="z. B. abend" autocomplete="off">
          <small class="hint">Kleinbuchstaben, Zahlen, _ und - · nach dem Anlegen nicht änderbar</small>
        </label>
        <label class="field">
          <span>Name der Senderliste</span>
          <input name="name" maxlength="80" placeholder="Programm" autocomplete="off">
        </label>
        <label class="field">
          <span>Pause vor dem Umschalten (Sekunden)</span>
          <input name="advance_delay_seconds" type="number" min="0" max="60" step="1">
        </label>
        <label class="field">
          <span>Gemeinsamer YouTube-Stream-Key (optional)</span>
          <input name="youtube_key" type="password" autocomplete="new-password"
                 placeholder="leer lassen = unverändert">
          <small id="playlist-key-hint" class="hint"></small>
        </label>
        <label class="field">
          <span>Alternativ: Env-Variablenname für den gemeinsamen Key</span>
          <input name="youtube_key_env" placeholder="z. B. PLAYLIST_YT_KEY" autocomplete="off">
        </label>
      </div>

      <div class="check-row">
        <label class="check"><input type="checkbox" name="auto_advance"> Bei Stream-Ende automatisch weiterschalten</label>
        <label class="check"><input type="checkbox" name="wrap"> Nach dem letzten Sender wieder beim ersten beginnen</label>
        <label class="check" id="playlist-clear-key-row" hidden>
          <input type="checkbox" name="clear_youtube_key"> Gespeicherten gemeinsamen Key entfernen
        </label>
      </div>

      <fieldset class="playlist-end">
        <legend>Automatisches Ende</legend>
        <div class="form-grid">
          <label class="field">
            <span>Ende</span>
            <select name="end_mode" id="playlist-end-mode">
              <option value="off">Kein automatisches Ende</option>
              <option value="duration">Nach Dauer</option>
              <option value="time">Zu Uhrzeit</option>
            </select>
          </label>
          <label class="field" id="playlist-end-duration-row" hidden>
            <span>Dauer ab Playlist-Start (Minuten)</span>
            <input name="end_after_minutes" type="number" min="1" max="43200" step="1">
          </label>
          <label class="field" id="playlist-end-time-row" hidden>
            <span>Ende täglich um (Uhrzeit)</span>
            <input name="end_time" type="time" value="23:00">
          </label>
        </div>
        <small class="hint">
          Uhrzeit gilt in der Container-Zeitzone. Ist sie beim Start bereits vorbei,
          wird die Playlist am nächsten Tag zur selben Zeit beendet.
        </small>
      </fieldset>

      <div class="playlist-editor">
        <div class="playlist-editor-head">
          <span>Senderreihenfolge</span>
          <small class="hint">Nur Sender in dieser Liste werden durchgeschaltet.</small>
        </div>
        <div id="playlist-channels" class="playlist-channels"></div>
        <div class="playlist-add">
          <select id="playlist-add-select" aria-label="Sender auswählen"></select>
          <button type="button" id="playlist-add-btn" class="btn ghost">+ Sender hinzufügen</button>
        </div>
      </div>

      <p id="playlist-error" class="form-error" hidden></p>

      <div class="modal-actions playlist-modal-actions">
        <button type="button" class="btn danger" id="playlist-delete" hidden>Senderliste löschen</button>
        <span class="spacer"></span>
        <button type="button" class="btn ghost" data-close>Abbrechen</button>
        <button type="submit" class="btn primary" id="playlist-save">Speichern</button>
      </div>
    </form>
  </dialog>
