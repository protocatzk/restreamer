name: CI

on:
  push:
    branches: [stream, main, master]
  pull_request:

permissions:
  contents: read

jobs:
  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Abhängigkeiten installieren
        run: pip install -r requirements-dev.txt
      - name: Typen prüfen
        run: mypy app asr

  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: JS-Syntax prüfen
        run: |
          for file in app/static/js/*.js app/static/theme.js; do
            node --input-type=module --check < "$file"
          done

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Abhängigkeiten installieren
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Tests
        run: |
          set +e
          pytest --junitxml=/tmp/pytest.xml --cov-report=xml:coverage.xml
          rc=$?
          if [ "$rc" -ne 0 ]; then
            python - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse("/tmp/pytest.xml").getroot()
          for case in root.iter("testcase"):
              failure = case.find("failure")
              if failure is None:
                  failure = case.find("error")
              if failure is None:
                  continue
              message = (failure.get("message") or "Test fehlgeschlagen").strip()
              first_line = message.splitlines()[0]
              trace = (failure.text or "").strip().splitlines()
              trace_hint = "%0A".join(trace[-15:]) if trace else ""
              path = case.get("file") or case.get("classname", "")
              line = case.get("line")
              location = f"file={path}" + (f",line={line}" if line else "")
              print(
                  f"::error {location}::"
                  f"{case.get('classname')}::{case.get('name')}: "
                  f"{first_line} [{trace_hint}]"
              )
          PY
          fi
          exit $rc
      - name: Coverage zu Codecov hochladen
        if: always()
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          flags: pytest
          name: restreamer
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Image bauen
        run: docker build -t restreamer:ci .
